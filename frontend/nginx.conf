server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Let React Router handle direct visits and page refreshes on client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Missing assets should return 404 instead of the application HTML.
    location /assets/ {
        try_files $uri =404;
    }

    # default nginx body size is 1MB but supplier-service's MAX_FILE_SIZE for image uploads is 5MB
    client_max_body_size 5m;

    location /api/auth {
        proxy_pass http://user-service:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/users {
        proxy_pass http://user-service:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/suppliers {
        proxy_pass http://supplier-service:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/orders {
        proxy_pass http://order-service:3002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/credits {
        proxy_pass http://credit-service:3003;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ensure that any other path returns error 404, as only the above 5 paths exist
    # nginx will choose the location of the longest matching prefix; if match with any other
    # location above, then it is routed correctly
    location /api/ {
        return 404;
    }
}
