# AI Assistance Disclosure:
# Tool: ChatGPT (Astra 6)
# Date: approx. 2026-10-25
# Scope: Generated the deploy workflow: reuse CI, push images to ECR via OIDC, deploy the backend to EC2 with docker compose, and upload the frontend to S3 with a CloudFront invalidation; skip docs-only changes.
# Author review: Reviewed, tested, and edited by Lim Shao Qi.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"] # docs-only changes don't need a redeploy
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets jobs swap GitHub's OIDC token for temporary AWS credentials

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    if: github.repository == 'AY2627S1-CS3219-P20/FoC' # forks lack the AWS/EC2 secrets; skipping this also skips the deploy jobs that need it
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, supplier-service, order-service, credit-service, notification-service]
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/foc/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/foc/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-backend:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Copy Compose config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.yaml,compose.prod.yaml,gateway/nginx.conf,data/csv,user-service/compose.yaml,supplier-service/compose.yaml,order-service/compose.yaml,credit-service/compose.yaml,notification-service/compose.yaml,frontend/compose.yaml"
          target: ${{ vars.EC2_APP_DIR }}
      - name: Pull images and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,AWS_REGION
          command_timeout: 15m
          script: |
            set -eu
            cd "${{ vars.EC2_APP_DIR }}"
            ECR_REGISTRY=$(grep -E '^ECR_REGISTRY=' .env | cut -d= -f2-)
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            export IMAGE_TAG
            dc="docker compose -f compose.yaml -f compose.prod.yaml"
            $dc pull
            $dc up -d --no-build --remove-orphans
            for s in user-service:3000 supplier-service:3001 order-service:3002 credit-service:3003 notification-service:3004; do
              name=${s%%:*}; port=${s##*:}
              for i in $(seq 1 30); do
                $dc exec -T "$name" wget -qO- "http://127.0.0.1:$port/healthz" >/dev/null 2>&1 && break
                if [ "$i" = 30 ]; then echo "$name is unhealthy"; $dc logs --tail 100 "$name"; exit 1; fi
                sleep 5
              done
            done
            # Load the gateway/nginx.conf that scp just copied over.
            $dc exec -T gateway nginx -s reload
            sed -i '/^IMAGE_TAG=/d' .env && echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            docker image prune -af --filter "until=72h"
      - name: Smoke test through CloudFront
        run: |
          # No token, so user-service itself must answer 401. Anything else means
          # CloudFront → gateway → service routing is broken.
          for i in $(seq 1 6); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.CLOUDFRONT_DOMAIN }}/api/users/me")
            [ "$status" = 401 ] && exit 0
            sleep 10
          done
          echo "Expected 401 from /api/users/me, got $status"; exit 1

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_AUTH_API_BASE_URL: /api
      VITE_SUPPLIER_API_BASE_URL: /api
      VITE_ORDER_API_BASE_URL: /api
      VITE_CREDIT_API_BASE_URL: /api
      VITE_NOTIFICATION_API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload hashed bundles (cache for a year)
        run: aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets" --cache-control "public,max-age=31536000,immutable"
      - name: Upload index.html, favicon and images (always revalidate)
        run: aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete --exclude "assets/*" --exclude "images/*" --cache-control "no-cache"
      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
