# AI Assistance Disclosure:
# Tool: ChatGPT (Astra 6)
# Date: approx. 2026-10-25
# Scope: Helped debug 502s after redeploys by resolving service addresses at request time (Docker resolver plus a variable upstream in proxy_pass).
# Author review: Reviewed, tested, and edited by Lim Shao Qi.

# Production API gateway on EC2: CloudFront forwards /api/* here; the SPA itself is on S3.
# The /api location blocks mirror frontend/nginx.conf, which still serves local `docker compose up`.
server {
    listen 8080;
    server_name _;

    # default nginx body size is 1MB but supplier-service's MAX_FILE_SIZE for image uploads is 5MB
    client_max_body_size 5m;

    # Look up service addresses through Docker's DNS on each request (cached 10s)
    # instead of once at startup, so recreated containers with new IPs never cause 502s.
    # proxy_pass only does this when the address is in a variable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        return 200 "ok\n";
    }

    location /api/auth {
        set $upstream user-service:3000;
        proxy_pass http://$upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/users {
        set $upstream user-service:3000;
        proxy_pass http://$upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/suppliers {
        set $upstream supplier-service:3001;
        proxy_pass http://$upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/orders {
        set $upstream order-service:3002;
        proxy_pass http://$upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/credits {
        set $upstream credit-service:3003;
        proxy_pass http://$upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Notifications: REST plus a long-lived Server-Sent Events stream.
    location /api/notifications {
        set $upstream notification-service:3004;
        proxy_pass http://$upstream;
 
        # SSE needs HTTP/1.1 keep-alive and no buffering, or events arrive in bursts
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
 
        # The stream stays open. The service sends a heartbeat every 15 s, so a
        # long read timeout only matters if the service stops responding.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
 
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Only the five prefixes above exist; anything else is a 404.
    location /api/ {
        return 404;
    }

    location / {
        return 404;
    }
}
