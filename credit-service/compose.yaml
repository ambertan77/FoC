# Scope: Generated the compose services for credit-service and its Postgres 17 database with a healthcheck and depends_on: service_healthy.
# Author review: Reviewed, tested, and edited by Lim Shao Qi.

services:
  # Source: Docker Hub Official Postgres Image — https://hub.docker.com/_/postgres
  credit-postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_DB: ${CREDIT_POSTGRES_DB:?Set CREDIT_POSTGRES_DB in credit-service/.env}
      POSTGRES_USER: ${CREDIT_POSTGRES_USER:?Set CREDIT_POSTGRES_USER in credit-service/.env}
      POSTGRES_PASSWORD: ${CREDIT_POSTGRES_PASSWORD:?Set CREDIT_POSTGRES_PASSWORD in credit-service/.env}
    volumes:
      - credit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 2s
      retries: 20

  credit-service:
    build: .
    restart: unless-stopped
    # ports:
    #   - "${PORT:?Set PORT in credit-service/.env}:${PORT}"
    env_file: .env
    volumes:
      - ../user-service/keys/public.pem:${JWT_PUBLIC_KEY_PATH:?Set JWT_PUBLIC_KEY_PATH in credit-service/.env}:ro
    depends_on:
      credit-postgres:
        condition: service_healthy

volumes:
  credit_postgres_data:
